name: build-apk-ime

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK with IME support
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure npm to use official registry
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 60000

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild (generate android project)
        run: npx expo prebuild --no-install

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK (universal)
        run: cd android && ./gradlew assembleRelease

      - name: Get version name
        id: version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename APKs
        run: |
          cd android/app/build/outputs/apk/release
          VERSION=${{ steps.version.outputs.version }}
          for ABI in arm64-v8a armeabi-v7a x86_64 universal; do
            SRC="app-${ABI}-release.apk"
            if [ -f "$SRC" ]; then
              mv "$SRC" "SyncClipboard-${VERSION}-IME-${ABI}.apk"
            fi
          done

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          name: SyncClipboard-IME-arm64-v8a
          path: android/app/build/outputs/apk/release/SyncClipboard-${{ steps.version.outputs.version }}-IME-arm64-v8a.apk

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v7
        with:
          name: SyncClipboard-IME-armeabi-v7a
          path: android/app/build/outputs/apk/release/SyncClipboard-${{ steps.version.outputs.version }}-IME-armeabi-v7a.apk

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v7
        with:
          name: SyncClipboard-IME-x86_64
          path: android/app/build/outputs/apk/release/SyncClipboard-${{ steps.version.outputs.version }}-IME-x86_64.apk

      - name: Upload universal APK
        uses: actions/upload-artifact@v7
        with:
          name: SyncClipboard-IME-universal
          path: android/app/build/outputs/apk/release/SyncClipboard-${{ steps.version.outputs.version }}-IME-universal.apk
